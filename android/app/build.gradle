apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.plataforma.lis"
    compileSdk project.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.plataforma.lis"
        minSdk project.ext.minSdkVersion
        targetSdk project.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Assets for Capacitor web view
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Capacitor core
    implementation project(':capacitor-android')

    // Kotlin coroutines — required for GeminiPlugin async calls
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    // Google Gemini AI SDK for Android
    // NOTE: Uncomment when ready to activate real Gemini calls:
    // implementation "com.google.ai.client.generativeai:generativeai:0.9.0"

    // AndroidX
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.webkit:webkit:1.11.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"

    // Capacitor cordova plugins
    implementation project(':capacitor-cordova-android-plugins')
}

// Apply Capacitor cordova support
apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, Google Services plugin not applied")
}
